name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android build and checks
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36'

      - name: Run Detekt
        run: >-
          ./gradlew --no-daemon
          :androidApp:detekt
          :shared:detekt
          :core:detekt
          :feature:home-feed:detekt
          :feature:catalog:detekt
          :feature:favorites:detekt
          :feature:profile:detekt
          :feature:camera:detekt

      - name: Run unit tests
        run: ./gradlew --no-daemon test

      - name: Build debug APK
        run: ./gradlew --no-daemon :androidApp:assembleDebug

      - name: Build release bundle
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: ./gradlew --no-daemon :androidApp:bundleRelease

      - name: Upload Android packages
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: catlas-${{ github.sha }}
          path: |
            androidApp/build/outputs/apk/debug/*.apk
            androidApp/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore

      - name: Publish test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ github.sha }}
          path: '**/build/test-results/**/*.xml'
          if-no-files-found: ignore
